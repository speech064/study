<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 귤 뽑기</title>
<style>
  :root {
    --sky1: #bfe9ff; --sky2: #fff6dc;
    --grass: #7cc36a; --grass-d: #5aa34e;
    --trunk: #8a5a36; --leaf: #3f9a4a; --leaf-d: #2f7d3b;
    --orange: #ff9f1a; --orange-d: #f07f00;
    --ink: #4a3426;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; overflow-x: hidden;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: var(--ink);
    background: linear-gradient(var(--sky1), var(--sky2) 70%);
    display: flex; flex-direction: column; align-items: center;
    padding: 16px;
  }
  h1 { font-size: clamp(1.4rem, 5vw, 2rem); margin-top: 8px; }
  .sub { font-size: .95rem; opacity: .75; margin: 4px 0 8px; }
  .counter {
    background: #fff; border-radius: 999px; padding: 6px 18px;
    font-weight: 700; box-shadow: 0 2px 8px #0002;
  }
  .counter b { color: var(--orange-d); font-size: 1.3em; }

  .stage { position: relative; width: min(420px, 100%); height: 400px; margin-top: 6px; }
  .ground {
    position: absolute; left: -20%; right: -20%; bottom: 0; height: 70px;
    background: var(--grass); border-radius: 50% 50% 0 0 / 40% 40% 0 0;
  }
  #tree { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #tree.shake { animation: shake .45s; transform-origin: 50% 90%; }
  @keyframes shake {
    0%,100% { transform: rotate(0); } 20% { transform: rotate(-2.5deg); }
    40% { transform: rotate(2.5deg); } 60% { transform: rotate(-1.5deg); } 80% { transform: rotate(1deg); }
  }
  .fruit { transition: opacity .3s; }
  .fruit.gone { opacity: 0; }
  .fall {
    position: absolute; width: 38px; height: 34px; z-index: 5; pointer-events: none;
    animation: drop .9s cubic-bezier(.5,0,1,.6) forwards;
  }
  @keyframes drop {
    to { transform: translateY(var(--dy)) rotate(200deg); }
  }

  .card {
    width: min(420px, 100%); min-height: 150px; margin-top: 10px;
    background: #fffdf5; border: 3px solid var(--orange); border-radius: 18px;
    padding: 16px 20px; text-align: center; box-shadow: 0 6px 16px #0002;
    display: flex; flex-direction: column; justify-content: center; gap: 6px;
  }
  .card.pop { animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.6) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  .card .jeju { font-size: 1.6rem; font-weight: 800; color: var(--orange-d); }
  .card .mean { font-size: 1.05rem; }
  .card .hint { opacity: .6; }
  .card .tag { font-size: .8rem; opacity: .55; }
  button.reset {
    margin-top: 12px; border: 0; background: transparent; color: var(--ink);
    opacity: .5; text-decoration: underline; cursor: pointer; font: inherit; font-size: .85rem;
  }
</style>
</head>
<body>
  <h1>🍊 제주 귤 뽑기</h1>
  <p class="sub">귤나무를 눌러 보세요!</p>
  <div class="counter">뽑은 귤 <b id="count">0</b>개</div>

  <div class="stage" id="stage">
    <div class="ground"></div>
    <svg id="tree" viewBox="0 0 400 400" role="button" aria-label="귤나무 누르기">
      <path d="M185 380 Q190 300 182 240 L218 240 Q210 300 215 380 Z" fill="#8a5a36"/>
      <path d="M200 270 Q160 250 140 215" stroke="#8a5a36" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M200 260 Q245 240 262 205" stroke="#8a5a36" stroke-width="10" fill="none" stroke-linecap="round"/>
      <g fill="#3f9a4a">
        <ellipse cx="200" cy="140" rx="130" ry="95"/>
        <ellipse cx="120" cy="170" rx="80" ry="62"/>
        <ellipse cx="285" cy="170" rx="80" ry="62"/>
      </g>
      <g fill="#2f7d3b" opacity=".45">
        <ellipse cx="160" cy="110" rx="40" ry="22"/><ellipse cx="250" cy="130" rx="44" ry="24"/>
        <ellipse cx="195" cy="185" rx="48" ry="22"/>
      </g>
      <g id="fruits"></g>
    </svg>
  </div>

  <div class="card" id="card">
    <div class="hint">🌳 나무를 누르면<br>제주어 덕담이 떨어져요</div>
  </div>
  <button class="reset" id="reset">처음부터 다시</button>

<script>
const GREETINGS = [
  { jeju: "혼저 옵서예", mean: "어서 오세요" },
  { jeju: "고라줍서", mean: "말씀해 주세요" },
  { jeju: "폭삭 속았수다", mean: "정말 수고 많으셨습니다" },
  { jeju: "경 허곡 정 허곡 잘 살아집서", mean: "이렇게 저렇게 잘 살아가세요" },
  { jeju: "아픈 디 어시 펜안헙서", mean: "아픈 데 없이 편안하세요" },
  { jeju: "오널도 좋은 날 뒈곡 우다", mean: "오늘도 좋은 날 되세요" },
  { jeju: "복 하영 받읍서", mean: "복 많이 받으세요" },
  { jeju: "하영 먹읍서", mean: "많이 드세요" },
  { jeju: "촘말로 고맙수다", mean: "정말 고맙습니다" },
  { jeju: "잘 가멘 또 오라이", mean: "잘 가요, 또 와요" },
  { jeju: "무사 경 웃엄수광? 좋은 일 이서마씸?", mean: "왜 그렇게 웃어요? 좋은 일 있어요?" },
  { jeju: "혼디 모영 살암시민 살아진다", mean: "함께 모여 살다 보면 다 살아진다" }
];
const SPOTS = [[150,110],[215,85],[265,130],[110,160],[190,150],[300,175],[145,205],[235,195],[75,185],[340,200],[200,115],[170,60]];
const NS = "http://www.w3.org/2000/svg";
const fruits = document.getElementById("fruits");
const tree = document.getElementById("tree");
const stage = document.getElementById("stage");
const card = document.getElementById("card");
const countEl = document.getElementById("count");
let count = 0, last = -1;

function makeFruit(x, y) {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "fruit");
  g.innerHTML =
    `<circle cx="${x}" cy="${y}" r="17" fill="#ff9f1a" stroke="#f07f00" stroke-width="2"/>` +
    `<ellipse cx="${x-6}" cy="${y-6}" rx="5" ry="3" fill="#fff" opacity=".45"/>` +
    `<path d="M${x-4} ${y-16} q4 -6 8 0 q-4 3 -8 0z" fill="#2f7d3b"/>`;
  g.dataset.x = x; g.dataset.y = y;
  return g;
}
function fill() {
  fruits.innerHTML = "";
  SPOTS.forEach(([x, y]) => fruits.appendChild(makeFruit(x, y)));
}

function pick() {
  tree.classList.remove("shake"); void tree.offsetWidth; tree.classList.add("shake");

  // 매달린 귤 중 하나를 골라 떨어뜨림
  const hanging = [...fruits.children].filter(f => !f.classList.contains("gone"));
  if (hanging.length) {
    const f = hanging[Math.floor(Math.random() * hanging.length)];
    f.classList.add("gone");
    const r = stage.getBoundingClientRect(), s = r.width / 400;
    const el = document.createElement("div");
    el.className = "fall";
    el.innerHTML = '<svg viewBox="0 0 38 34"><circle cx="19" cy="18" r="15" fill="#ff9f1a" stroke="#f07f00" stroke-width="2"/><path d="M15 4q4-6 8 0q-4 3-8 0z" fill="#2f7d3b"/></svg>';
    el.style.left = (f.dataset.x * s - 19) + "px";
    el.style.top = (f.dataset.y * s - 17) + "px";
    el.style.setProperty("--dy", (r.height - 40 - f.dataset.y * s) + "px");
    stage.appendChild(el);
    setTimeout(() => el.remove(), 1000);
    // 다 떨어지면 새 귤이 열림
    if (hanging.length === 1) setTimeout(fill, 1200);
  }

  let i;
  do { i = Math.floor(Math.random() * GREETINGS.length); } while (i === last && GREETINGS.length > 1);
  last = i;
  const g = GREETINGS[i];
  setTimeout(() => {
    card.innerHTML = `<div class="tag">🍊 제주어 덕담</div><div class="jeju">${g.jeju}</div><div class="mean">(${g.mean})</div>`;
    card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
    countEl.textContent = ++count;
  }, 700);
}

tree.addEventListener("click", pick);
document.getElementById("reset").addEventListener("click", () => {
  count = 0; countEl.textContent = 0; last = -1; fill();
  card.innerHTML = '<div class="hint">🌳 나무를 누르면<br>제주어 덕담이 떨어져요</div>';
});
fill();
</script>
</body>
</html>
